<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TokenBench</title>
<style>
  /* Stable local boot screen. The remote widget is loaded only after the
     bundled collector confirms it is listening on IPv4 loopback. */
  html, body { margin: 0; height: 100%; background: #0f1115; color: #8b93a7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .box { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; text-align: center; padding: 20px; }
  .t { color: #e6e9ef; font-weight: 600; }
  button { margin-top: 8px; padding: 6px 11px; border-radius: 7px;
    border: 1px solid #2b3240; background: #171a21; color: #e6e9ef;
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { color: #2dd4bf; border-color: #2dd4bf; }
</style>
</head>
<body>
  <div class="box">
    <div class="t">TokenBench</div>
    <div id="status">Starting the local collector…</div>
    <button id="reload" type="button">Reload widget</button>
  </div>
  <script>
    'use strict'
    const status = document.getElementById('status')
    const reload = document.getElementById('reload')
    const tauri = window.__TAURI_INTERNALS__
    let timer = null

    async function loadWidget() {
      clearTimeout(timer)
      status.textContent = 'Connecting to the local collector…'
      try {
        const ready = tauri && typeof tauri.invoke === 'function'
          ? await tauri.invoke('load_widget_cmd')
          : false
        if (!ready) {
          status.textContent = 'Collector is still starting…'
          timer = setTimeout(loadWidget, 500)
        }
      } catch {
        status.textContent = 'Could not load the widget yet.'
        timer = setTimeout(loadWidget, 1000)
      }
    }

    reload.addEventListener('click', loadWidget)
    loadWidget()
  </script>
</body>
</html>
