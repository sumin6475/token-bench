[package]
name = "tokenbench"
version = "0.1.0"
description = "TokenBench — always-on-top cost & context widget"
authors = ["Sumin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binary for a menubar-sized widget.
[profile.release]
opt-level = "s"
lto = true
strip = true
